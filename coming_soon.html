<!DOCTYPE html>
<html lang="ko">
<head><title>현대건설 H-네이처가든 | 페이지 준비중</title>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&amp;display=swap" rel="stylesheet"/>
<style>
:root{
  --green-deep:#00793A; --green:#00A950; --green-light:#3DC177; --green-pale:#E6F7EC;
  --gold:#FDBA31; --navy:#004B8D; --ink:#16241c;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body {
  font-family:'Noto Sans KR','Malgun Gothic','Pretendard','Segoe UI',sans-serif;
  color:var(--ink);
  min-height:100vh;
  display:flex; flex-direction:column;
  background:
    radial-gradient(circle at 15% 12%, rgba(255,255,255,.10), transparent 40%),
    radial-gradient(circle at 85% 88%, rgba(255,255,255,.08), transparent 45%),
    linear-gradient(160deg, var(--green-deep), var(--green) 55%, var(--green-light));
  overflow-x:hidden;
}
.logo-bar { background:rgba(255,255,255,.96); padding:10px 12px; display:flex; align-items:center; justify-content:center; gap:12px; row-gap:8px; flex-wrap:wrap; box-shadow:0 2px 10px rgba(0,0,0,.05); }
.logo-item { display:flex; align-items:center; }
.logo-item img { display:block; height:20px; width:auto; }
.logo-sep { display:none; width:1px; height:18px; background:#dfe6e0; }
@media (min-width:380px){ .logo-item img{height:24px;} }
@media (min-width:560px){ .logo-bar{gap:22px; padding:12px 20px;} .logo-item img{height:32px;} .logo-sep{display:block;} }

.wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:32px 20px; position:relative; }

.leaf { position:absolute; font-size:1.8rem; opacity:.16; filter:drop-shadow(0 4px 6px rgba(0,0,0,.15)); animation:drift 9s ease-in-out infinite; }
.leaf.l1 { top:10%; left:8%; animation-delay:0s; font-size:2.4rem; }
.leaf.l2 { top:20%; right:10%; animation-delay:1.5s; }
.leaf.l3 { bottom:16%; left:12%; animation-delay:3s; font-size:2rem; }
.leaf.l4 { bottom:24%; right:14%; animation-delay:4.5s; font-size:2.6rem; }
@keyframes drift {
  0%,100% { transform:translateY(0) rotate(0deg); }
  50% { transform:translateY(-18px) rotate(8deg); }
}

.card {
  position:relative; z-index:2;
  background:rgba(255,255,255,.98);
  border-radius:24px;
  padding:48px 34px 38px;
  max-width:460px; width:100%;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,40,20,.28);
}
.badge {
  width:82px; height:82px; border-radius:50%;
  background:linear-gradient(135deg,var(--green-light),var(--green-deep));
  display:flex; align-items:center; justify-content:center;
  font-size:2.3rem; margin:0 auto 22px;
  box-shadow:0 10px 22px rgba(0,121,58,.3);
  animation:sprout 2.6s ease-in-out infinite;
}
@keyframes sprout {
  0%,100% { transform:scale(1) translateY(0); }
  50% { transform:scale(1.06) translateY(-4px); }
}
.eyebrow { font-size:.78rem; font-weight:800; color:var(--green); letter-spacing:.04em; margin-bottom:10px; text-transform:uppercase; }
.card h1 { font-size:1.5rem; font-weight:900; color:var(--ink); letter-spacing:-.02em; margin-bottom:14px; line-height:1.4; }
.card p { font-size:.92rem; color:#5b6b5d; line-height:1.75; margin-bottom:6px; }
.card p + p { margin-top:2px; }

.dots { display:flex; justify-content:center; gap:8px; margin:26px 0 24px; }
.dots span { width:8px; height:8px; border-radius:50%; background:var(--green); opacity:.35; animation:blink 1.4s infinite; }
.dots span:nth-child(2){ animation-delay:.2s; }
.dots span:nth-child(3){ animation-delay:.4s; }
@keyframes blink { 0%,80%,100%{opacity:.25;transform:scale(1);} 40%{opacity:1;transform:scale(1.25);} }

.divider { height:1px; background:#eef3ee; margin:22px 0 20px; }

.meta-row { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
.meta-pill { background:var(--green-pale); color:var(--green-deep); font-size:.72rem; font-weight:800; padding:6px 14px; border-radius:999px; }

.home-link { display:inline-block; margin-top:22px; font-size:.82rem; font-weight:800; color:var(--navy); text-decoration:none; border-bottom:2px solid var(--navy); padding-bottom:2px; }
.home-link:hover { opacity:.75; }

.footer-note { text-align:center; font-size:.72rem; color:rgba(255,255,255,.85); padding:18px 20px 26px; line-height:1.8; }

@media (max-width:420px){
  .card { padding:40px 24px 32px; border-radius:20px; }
  .card h1 { font-size:1.28rem; }
}
</style>
</head>
